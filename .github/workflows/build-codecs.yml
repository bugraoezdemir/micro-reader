# Build micro-reader-codecs: one abi3 wheel per platform (Python >= 3.11) and
# the sdist.  Called by ci.yml (every push) and release.yml (codecs-v* tags).
name: Build codecs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }   # cross-compiled
          - { name: windows-x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: codecs
          target: ${{ matrix.platform.target }}
          manylinux: auto          # ignored outside Linux
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: codecs-wheel-${{ matrix.platform.name }}
          path: codecs/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: codecs
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: codecs-sdist
          path: codecs/dist
