# Build micro-reader-codecs: one abi3 wheel per platform (Python >= 3.11) and
# the sdist.  Called by ci.yml (every push) and release.yml (codecs-v* tags).
#
# With `crate: core` it builds micro-reader-core the same way (core/, artifacts
# core-wheel-* and core-sdist): the read engine links the codecs crate as a Rust
# library (Workplan decision MR-8), so it needs the same C toolchain.
#
# The codecs link two C libraries from codecs/vendor (codecs/build.rs): libjpeg-turbo,
# built with CMake and its SIMD (x86 needs NASM; ARM's NEON is C), and jxrlib.
# MICRO_READER_REQUIRE_SIMD=1 makes a wheel without SIMD a failed build, not a slow one.
name: Build codecs

on:
  workflow_call:
    inputs:
      crate:
        description: "the folder to build: codecs (micro-reader-codecs) or core (micro-reader-core)"
        type: string
        default: codecs

permissions:
  contents: read

env:
  MICRO_READER_REQUIRE_SIMD: "1"
  NASM_VERSION: "2.16.03"

jobs:
  wheels:
    name: wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }   # cross-compiled
          - { name: windows-x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      # NASM for libjpeg-turbo's x86 SIMD (Linux x86_64 builds it inside the
      # manylinux container below; ARM targets need none)
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: NASM (macOS, for the x86_64 wheel)
        if: runner.os == 'macOS' && matrix.platform.target == 'x86_64'
        run: brew install nasm
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ inputs.crate }}
          target: ${{ matrix.platform.target }}
          manylinux: auto          # ignored outside Linux
          args: --release --out dist
          # the manylinux container: its own NASM (the distribution's is too old for
          # AVX2) and CMake; the SIMD requirement passed in
          docker-options: -e MICRO_READER_REQUIRE_SIMD=1
          before-script-linux: |
            set -e
            if ! command -v cmake >/dev/null 2>&1; then
              python3 -m pip install cmake || pip3 install cmake
            fi
            if [ "$(uname -m)" = "x86_64" ] && ! command -v nasm >/dev/null 2>&1; then
              curl -fsSL "https://www.nasm.us/pub/nasm/releasebuilds/${NASM_VERSION:-2.16.03}/nasm-${NASM_VERSION:-2.16.03}.tar.xz" -o /tmp/nasm.tar.xz
              tar -xJf /tmp/nasm.tar.xz -C /tmp
              (cd /tmp/nasm-${NASM_VERSION:-2.16.03} && ./configure --prefix=/usr/local >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null)
            fi
            cmake --version
            if [ "$(uname -m)" = "x86_64" ]; then nasm -v; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.crate }}-wheel-${{ matrix.platform.name }}
          path: ${{ inputs.crate }}/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ inputs.crate }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.crate }}-sdist
          path: ${{ inputs.crate }}/dist
