# Tests, on every push to dev / main and every pull request, and before every
# release (release.yml calls this workflow): build the codecs wheels, then test
# micro-reader against exactly those wheels on every OS and supported Python,
# once more on the reference decoders (no native module), once on the oldest
# declared dependencies, and check the codecs' third-party licence notices are
# current.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # a newer push to the same branch / PR cancels the older run (not releases)
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  codecs:
    uses: ./.github/workflows/build-codecs.yml

  licences:
    name: licence notices current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate THIRD_PARTY_LICENSES.txt and compare
        working-directory: codecs
        run: |
          cargo fetch --locked
          python3 scripts/third_party_licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.txt

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: codecs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: codecs-wheel-*
          merge-multiple: true
          path: wheels
      - name: install micro-reader with the codecs wheel just built
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links wheels -e "python[test]"
      - name: tests (native decoders)
        run: python -m pytest -q
      - name: tests (reference decoders)
        env:
          MICRO_READER_NO_NATIVE: "1"
        run: python -m pytest -q

  oldest:
    name: test oldest declared dependencies
    needs: codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: codecs-wheel-*
          merge-multiple: true
          path: wheels
      - name: install the floors (numpy, tifffile, h5py)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links wheels "numpy==1.24.4" "tifffile==2025.5.21" \
            "h5py==3.11.0" pytest zstandard -e python
      - name: tests (tests needing missing references skip)
        run: python -m pytest -q

  package:
    name: packages build and install
    needs: codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: codecs-wheel-*
          merge-multiple: true
          path: wheels
      - name: build micro-reader's sdist and wheel, check their metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/* wheels/*
      - name: the built wheel installs and imports (not the source tree)
        run: |
          python -m pip install --find-links wheels dist/*.whl
          cd /tmp && python -c "import micro_reader, micro_reader_codecs; print(micro_reader.__file__)"
