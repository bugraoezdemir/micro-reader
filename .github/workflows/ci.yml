# Tests run in two places: on a pull request (any target branch; when it is
# opened, on every new commit, when it is reopened) and before every release
# (release.yml calls this workflow; nothing is published unless it passes).
# Plain pushes do not run them; workflow_dispatch runs them by hand.
#
# What runs: build the codecs wheels and the read engine's (micro-reader-core;
# micro-reader requires both), then test micro-reader against exactly those wheels
# on every OS and supported Python, once more without native code (the Python path
# on the reference decoders), once on the oldest declared dependencies, and check
# the third-party licence notices of both native packages are current.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # a newer push to the same branch / PR cancels the older run (not releases)
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  codecs:
    uses: ./.github/workflows/build-codecs.yml

  core:
    uses: ./.github/workflows/build-codecs.yml
    with:
      crate: core

  licences:
    name: licence notices current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate THIRD_PARTY_LICENSES.txt (codecs and core) and compare
        working-directory: codecs
        run: |
          cargo fetch --locked
          (cd ../core && cargo fetch --locked)
          python3 scripts/third_party_licenses.py
          python3 scripts/third_party_licenses.py ../core
          git diff --exit-code THIRD_PARTY_LICENSES.txt ../core/THIRD_PARTY_LICENSES.txt

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: [codecs, core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel-*"
          merge-multiple: true
          path: wheels
      - name: install micro-reader with the codecs and core wheels just built
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links wheels -e "python[test]"
          # exactly the wheels of this run, even where PyPI has the same versions
          python -m pip install --no-index --find-links wheels --force-reinstall --no-deps micro-reader-codecs micro-reader-core
      # the read engine and the native decoders; then no native code at all: the
      # Python path with the reference decoders (test_engine.py compares the engine
      # with the Python path on the native decoders)
      - name: tests (read engine, native decoders)
        run: python -m pytest -q
      - name: tests (Python path, reference decoders)
        env:
          MICRO_READER_NO_NATIVE: "1"
        run: python -m pytest -q

  oldest:
    name: test oldest declared dependencies
    needs: [codecs, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel-*"
          merge-multiple: true
          path: wheels
      - name: install the floors (numpy, tifffile, h5py)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links wheels "numpy==1.24.4" "tifffile==2025.5.21" \
            "h5py==3.11.0" pytest zstandard -e python
      - name: tests (tests needing missing references skip)
        run: python -m pytest -q

  package:
    name: packages build and install
    needs: [codecs, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel-*"
          merge-multiple: true
          path: wheels
      - name: build micro-reader's sdist and wheel, check their metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/* wheels/*
      - name: the built wheel installs and imports with its native packages (not the source tree)
        run: |
          python -m pip install --find-links wheels dist/*.whl
          cd /tmp && python -c "import micro_reader, micro_reader_codecs, micro_reader_core as m; from micro_reader import _engine; assert _engine.enabled(); print(micro_reader.__file__, m.__version__, m.CODECS_VERSION)"
