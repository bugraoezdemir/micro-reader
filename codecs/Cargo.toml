[package]
name = "micro-reader-codecs"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/bugraoezdemir/micro-reader"
description = "Native image decoders for micro-reader (Python module micro_reader_codecs)"

[lib]
name = "micro_reader_codecs"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform for every Python >= 3.11 (micro-reader PLAN.md, "Native code")
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
# the official zstd C library behind a Rust wrapper (decided 2026-09-30)
zstd = { version = "0.14", default-features = false }
# every codec an accepted format can contain (rule, 2026-09-30); all MIT /
# Apache / BSD
weezl = "0.2"                 # LZW (TIFF variant), pure Rust
jpeg-decoder = { version = "0.3", default-features = false }   # JPEG incl. lossless, pure Rust
# jpegxr = "0.3"              # Microsoft jxrlib (BSD) wrapper -- needs libclang to build; pending decision
jxl-oxide = "0.12"            # JPEG XL, pure Rust
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
# TIFF's codecs (compression audit, 2026-10-01)
libdeflater = "1.26"          # zlib / deflate: libdeflate (MIT), C built with cc
# streaming deflate for blocks too large to decode whole (libdeflate decodes whole
# buffers only): miniz_oxide, pure Rust, MIT / Zlib / Apache -- its inflater
# state can be copied, which checkpoints need
miniz_oxide = "0.8"
png = "0.18"                  # PNG, pure Rust
image-webp = "0.2"            # WebP lossless + lossy, pure Rust
# JPEG 2000 through OpenJPEG (BSD-2; the decoder imagecodecs uses), C built with
# cc from pre-generated bindings: no libclang needed
jpeg2k = { version = "0.10", default-features = false, features = ["openjpeg-sys"] }   # single-threaded: micro-reader's pool decodes tiles in parallel

[profile.release]
lto = true
codegen-units = 1
