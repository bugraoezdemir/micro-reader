[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "micro-reader-core"
dynamic = ["version"]              # from Cargo.toml: one place for the version
description = "Native (Rust) read engine for micro-reader: positioned reads, decoding and placement of a whole region in one call, without Python's lock."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# TODO before the first upload: THIRD_PARTY_LICENSES.txt for everything linked
# (micro-reader-codecs' decoders and C libraries included), as codecs/ has
license-files = ["LICENSE"]
authors = [{ name = "Bugra Oezdemir", email = "bugraa.ozdemir@gmail.com" }]
keywords = ["microscopy", "image reading", "native", "rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# no Python dependencies: a compiled module only

[project.urls]
Homepage = "https://github.com/bugraoezdemir/micro-reader"
Source = "https://github.com/bugraoezdemir/micro-reader"
Issues = "https://github.com/bugraoezdemir/micro-reader/issues"

[tool.maturin]
module-name = "micro_reader_core"
# the C build settings for MSVC (SSE2 defines for OpenJPEG) must reach source builds too
include = [{ path = ".cargo/config.toml", format = "sdist" }]
